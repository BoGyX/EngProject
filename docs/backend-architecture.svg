<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ece7e2" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#6b7280"/>
    </marker>
    <style>
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .header { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 18; ry: 18; }
      .section-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .section-copy { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .small-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .line { stroke: #6b7280; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .note { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #92400e; }
    </style>
  </defs>

  <rect width="1600" height="1180" fill="url(#grid)"/>

  <text x="800" y="56" text-anchor="middle" class="title">Backend Architecture</text>
  <text x="800" y="84" text-anchor="middle" class="subtitle">English Learning Platform: Gin API, PostgreSQL, course and training flow</text>

  <rect x="645" y="118" width="310" height="92" class="header"/>
  <text x="800" y="152" text-anchor="middle" class="section-title">main.go</text>
  <text x="800" y="178" text-anchor="middle" class="section-copy">Bootstraps config, DB, services, handlers and route groups</text>

  <rect x="70" y="280" width="230" height="178" class="box"/>
  <text x="92" y="314" class="small-title">Config</text>
  <text x="92" y="342" class="section-copy">
    <tspan x="92" dy="0">- internal/config</tspan>
    <tspan x="92" dy="22">- .env / .env.example</tspan>
    <tspan x="92" dy="22">- JWT, DB, server settings</tspan>
    <tspan x="92" dy="22">- Moodle flags and URLs</tspan>
    <tspan x="92" dy="22">- port and upload paths</tspan>
  </text>

  <rect x="340" y="280" width="250" height="212" class="box"/>
  <text x="362" y="314" class="small-title">Database</text>
  <text x="362" y="342" class="section-copy">
    <tspan x="362" dy="0">- internal/database/database.go</tspan>
    <tspan x="362" dy="22">- PostgreSQL connection via pgx</tspan>
    <tspan x="362" dy="22">- backend/migrations/*</tspan>
    <tspan x="362" dy="22">- schema.sql and SQL helpers</tspan>
    <tspan x="362" dy="22">- health check through db.Ping</tspan>
    <tspan x="362" dy="22">- shared storage for course data</tspan>
  </text>

  <rect x="630" y="280" width="300" height="212" class="box"/>
  <text x="652" y="314" class="small-title">Middleware</text>
  <text x="652" y="342" class="section-copy">
    <tspan x="652" dy="0">- auth.go</tspan>
    <tspan x="652" dy="22">- admin.go</tspan>
    <tspan x="652" dy="22">- optional_auth.go</tspan>
    <tspan x="652" dy="22">- cors.go</tspan>
    <tspan x="652" dy="22">- protects admin and user flows</tspan>
    <tspan x="652" dy="22">- allows public or optional auth reads</tspan>
  </text>

  <rect x="970" y="280" width="280" height="212" class="box"/>
  <text x="992" y="314" class="small-title">Routes in main.go</text>
  <text x="992" y="342" class="section-copy">
    <tspan x="992" dy="0">- /health and /swagger</tspan>
    <tspan x="992" dy="22">- /api/auth</tspan>
    <tspan x="992" dy="22">- /api/courses, /decks, /cards</tspan>
    <tspan x="992" dy="22">- /api/vocabulary and translations</tspan>
    <tspan x="992" dy="22">- /api/training-sessions</tspan>
    <tspan x="992" dy="22">- /api/admin and /api/upload</tspan>
  </text>

  <rect x="1290" y="280" width="240" height="178" class="box"/>
  <text x="1312" y="314" class="small-title">Docs and Storage</text>
  <text x="1312" y="342" class="section-copy">
    <tspan x="1312" dy="0">- backend/docs (Swagger)</tspan>
    <tspan x="1312" dy="22">- backend/uploads</tspan>
    <tspan x="1312" dy="22">- image and audio files</tspan>
    <tspan x="1312" dy="22">- router.Static('/uploads')</tspan>
    <tspan x="1312" dy="22">- used by cards and reader</tspan>
  </text>

  <rect x="90" y="560" width="360" height="500" class="box"/>
  <text x="112" y="596" class="section-title">Models</text>
  <text x="112" y="626" class="section-copy">
    <tspan x="112" dy="0">- user.go</tspan>
    <tspan x="112" dy="22">- refresh_token.go</tspan>
    <tspan x="112" dy="22">- course.go, course_access.go</tspan>
    <tspan x="112" dy="22">- deck.go, card.go</tspan>
    <tspan x="112" dy="22">- user_course.go, user_deck.go, user_card.go</tspan>
    <tspan x="112" dy="22">- training_session.go</tspan>
    <tspan x="112" dy="22">- reading_text.go</tspan>
    <tspan x="112" dy="22">- personal_vocabulary.go</tspan>
    <tspan x="112" dy="22">- personal_word_translation.go</tspan>
    <tspan x="112" dy="22">- describe DB entities and JSON payloads</tspan>
  </text>
  <text x="112" y="876" class="note">Entity layer for courses, decks, cards, reader and progress.</text>

  <rect x="500" y="560" width="360" height="500" class="box"/>
  <text x="522" y="596" class="section-title">Services</text>
  <text x="522" y="626" class="section-copy">
    <tspan x="522" dy="0">- user_service.go</tspan>
    <tspan x="522" dy="22">- course_service.go</tspan>
    <tspan x="522" dy="22">- course_access_service.go</tspan>
    <tspan x="522" dy="22">- deck_service.go, card_service.go</tspan>
    <tspan x="522" dy="22">- user_course_service.go</tspan>
    <tspan x="522" dy="22">- user_deck_service.go</tspan>
    <tspan x="522" dy="22">- user_card_service.go</tspan>
    <tspan x="522" dy="22">- training_session_service.go</tspan>
    <tspan x="522" dy="22">- training_session_flow.go</tspan>
    <tspan x="522" dy="22">- reading_text_service.go</tspan>
    <tspan x="522" dy="22">- dictionary_service.go</tspan>
    <tspan x="522" dy="22">- personal_vocabulary_service.go</tspan>
    <tspan x="522" dy="22">- personal_word_translation_service.go</tspan>
    <tspan x="522" dy="22">- moodle_service.go</tspan>
    <tspan x="522" dy="22">- course_progress_lock.go</tspan>
  </text>
  <text x="522" y="942" class="note">Business logic: access, study flow, training modes, reader and vocabulary.</text>

  <rect x="910" y="560" width="360" height="500" class="box"/>
  <text x="932" y="596" class="section-title">Handlers</text>
  <text x="932" y="626" class="section-copy">
    <tspan x="932" dy="0">- auth_handler.go</tspan>
    <tspan x="932" dy="22">- user_handler.go</tspan>
    <tspan x="932" dy="22">- course_handler.go</tspan>
    <tspan x="932" dy="22">- course_public_handler.go</tspan>
    <tspan x="932" dy="22">- course_import_handler.go</tspan>
    <tspan x="932" dy="22">- deck_handler.go</tspan>
    <tspan x="932" dy="22">- card_handler.go</tspan>
    <tspan x="932" dy="22">- dictionary_handler.go</tspan>
    <tspan x="932" dy="22">- personal_vocabulary_handler.go</tspan>
    <tspan x="932" dy="22">- personal_word_translation_handler.go</tspan>
    <tspan x="932" dy="22">- reading_text_handler.go</tspan>
    <tspan x="932" dy="22">- training_session_handler.go</tspan>
    <tspan x="932" dy="22">- upload_handler.go</tspan>
    <tspan x="932" dy="22">- user_course_handler.go</tspan>
    <tspan x="932" dy="22">- user_deck_handler.go</tspan>
    <tspan x="932" dy="22">- user_card_handler.go</tspan>
  </text>
  <text x="932" y="964" class="note">HTTP layer for public, authenticated and admin endpoints.</text>

  <rect x="1320" y="560" width="200" height="500" class="box"/>
  <text x="1342" y="596" class="section-title">Core flows</text>
  <text x="1342" y="626" class="section-copy">
    <tspan x="1342" dy="0">- Auth and JWT refresh</tspan>
    <tspan x="1342" dy="22">- Course publishing</tspan>
    <tspan x="1342" dy="22">- Course access grants</tspan>
    <tspan x="1342" dy="22">- Deck and card CRUD</tspan>
    <tspan x="1342" dy="22">- Reader and podcasts</tspan>
    <tspan x="1342" dy="22">- Personal vocabulary</tspan>
    <tspan x="1342" dy="22">- Personal translations</tspan>
    <tspan x="1342" dy="22">- Training session start</tspan>
    <tspan x="1342" dy="22">- Submit answer flow</tspan>
    <tspan x="1342" dy="22">- Upload image and audio</tspan>
    <tspan x="1342" dy="22">- Admin moderation</tspan>
  </text>
  <text x="1342" y="864" class="note">Most user-visible behavior runs through this lane.</text>

  <path d="M 800 210 L 800 248" class="line"/>
  <path d="M 800 248 L 185 248 L 185 280" class="line"/>
  <path d="M 800 248 L 465 248 L 465 280" class="line"/>
  <path d="M 800 248 L 780 248 L 780 280" class="line"/>
  <path d="M 800 248 L 1110 248 L 1110 280" class="line"/>
  <path d="M 800 248 L 1410 248 L 1410 280" class="line"/>

  <path d="M 465 492 L 465 530 L 270 530 L 270 560" class="line"/>
  <path d="M 780 492 L 780 530 L 680 530 L 680 560" class="line"/>
  <path d="M 1110 492 L 1110 530 L 1090 530 L 1090 560" class="line"/>
  <path d="M 1410 458 L 1410 520" class="line"/>

  <path d="M 450 810 L 500 810" class="line"/>
  <path d="M 860 810 L 910 810" class="line"/>
  <path d="M 1270 810 L 1320 810" class="line"/>

  <text x="475" y="792" text-anchor="middle" class="subtitle">entities</text>
  <text x="885" y="792" text-anchor="middle" class="subtitle">HTTP + validation</text>
  <text x="1295" y="792" text-anchor="middle" class="subtitle">user journeys</text>
</svg>
